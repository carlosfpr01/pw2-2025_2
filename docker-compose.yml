version: '3.8'

services:
  # Banco de dados MySQL
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pw2
      MYSQL_USER: pw2
      MYSQL_PASSWORD: pw2
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Serviço de Usuários
  users-service:
    build:
      context: ./users
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: users-service
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mysql://mysql:3306/pw2
      QUARKUS_DATASOURCE_USERNAME: pw2
      QUARKUS_DATASOURCE_PASSWORD: pw2
      QUARKUS_HTTP_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Serviço de Gastos
  gastos-service:
    build:
      context: ./gastos
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: gastos-service
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mysql://mysql:3306/pw2
      QUARKUS_DATASOURCE_USERNAME: pw2
      QUARKUS_DATASOURCE_PASSWORD: pw2
      QUARKUS_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway
  api-gateway:
    build:
      context: ./gateway
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: api-gateway
    environment:
      QUARKUS_HTTP_PORT: 8080
      QUARKUS_REST_CLIENT_USERS_API_URL: http://users-service:8082
      QUARKUS_REST_CLIENT_GASTOS_API_URL: http://gastos-service:8081
    ports:
      - "8080:8080"
    depends_on:
      - users-service
      - gastos-service
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Jaeger para tracing (Observabilidade)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"  # Jaeger UI
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      COLLECTOR_OTLP_ENABLED: true
    networks:
      - microservices-network

  # Graylog para logs centralizados (Opcional)
  graylog:
    image: graylog/graylog:5.0
    container_name: graylog
    environment:
      GRAYLOG_PASSWORD_SECRET: somepasswordpepper
      GRAYLOG_ROOT_PASSWORD_SHA2: 8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918 # "admin"
      GRAYLOG_HTTP_EXTERNAL_URI: http://localhost:9000/
    ports:
      - "9000:9000"   # Graylog web interface
      - "12201:12201" # GELF UDP
      - "12201:12201/udp"
    depends_on:
      - mongo
      - elasticsearch
    networks:
      - microservices-network

  # MongoDB para Graylog
  mongo:
    image: mongo:5.0
    container_name: mongo
    networks:
      - microservices-network
    volumes:
      - mongo-data:/data/db

  # Elasticsearch para Graylog
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    networks:
      - microservices-network
    volumes:
      - es-data:/usr/share/elasticsearch/data

networks:
  microservices-network:
    driver: bridge

volumes:
  mysql-data:
  mongo-data:
  es-data:
